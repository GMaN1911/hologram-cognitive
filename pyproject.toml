[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hologram-cognitive"
version = "0.4.0"
description = "The working set of files for every prompt: Hologram's routing engine for coding agents (Claude Code hooks, Hermes Agent memory provider). Free and MIT; Hologram Pro adds the project graph, guards, memory and the blackboard."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Garret Sutherland", email = "gsutherland@mirrorethic.com" }
]
keywords = ["llm", "context", "routing", "claude-code", "hermes-agent", "coding-agents", "working-set"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hologram = "hologram.cli:main"

[project.urls]
Homepage = "https://hologram-pro.dev"
Repository = "https://github.com/GMaN1911/hologram-cognitive"
"Hologram Pro" = "https://hologram-pro.dev"

[tool.hatch.build.targets.wheel]
packages = ["hologram"]

[tool.hatch.build.targets.sdist]
include = ["hologram", "tests", "README.md", "LICENSE", "VERSION_HISTORY.md", "pyproject.toml"]
